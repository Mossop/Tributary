[tools]
rust = { version = "1.96", components = "clippy,rustfmt" }
node = "26"
watchexec = "2.8"

[tasks.install]
description = "Install frontend dependencies"
dir = "frontend"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."build:frontend"]
description = "Build the frontend into frontend/dist"
depends = ["install"]
dir = "frontend"
run = "npm run build"

[tasks."build:server"]
description = "Build the server (release)"
run = "cargo build --release --manifest-path server/Cargo.toml"

[tasks.build]
description = "Build frontend and server"
depends = ["build:frontend", "build:server"]

[tasks."dev:server"]
description = "Run the server against tributary.toml"
run = "cargo run --manifest-path server/Cargo.toml"
# For `mise watch`. Migrations are embedded in the binary. `outputs = []`
# stops `mise run` skipping the task when its sources are unchanged.
sources = [
  "server/Cargo.toml",
  "server/Cargo.lock",
  "server/src/**/*",
  "server/migrations/**/*",
  "tributary.toml",
]
outputs = []

[tasks."dev:frontend"]
description = "Run the Vite dev server (proxies /api to :8080)"
depends = ["install"]
dir = "frontend"
run = "npm run dev"
# For `mise watch`. Vite reloads changes to the app itself, so only its
# configuration and dependencies need a restart. `outputs = []` stops
# `mise run` skipping the task when its sources are unchanged.
sources = ["package.json", "package-lock.json", "vite.config.ts"]
outputs = []

[tasks.dev]
description = "Run the server and Vite dev server, restarting them when their sources change"
depends = ["watch:server", "watch:frontend"]

# `npm ci` rewrites node_modules, and the flood of file events makes both
# watchers restart, killing it before it finishes. So install before either
# watcher starts, and don't rerun it under the watcher.
[tasks."watch:server"]
hide = true
depends = ["install"]
run = "mise watch --restart dev:server"

[tasks."watch:frontend"]
hide = true
depends = ["install"]
run = "mise watch --restart --skip-deps dev:frontend"

[tasks."test:server"]
description = "Run server tests"
run = "cargo test --manifest-path server/Cargo.toml"

[tasks."test:frontend"]
description = "Run frontend unit tests"
depends = ["install"]
dir = "frontend"
run = "npm test"

[tasks.test]
description = "Run all tests"
depends = ["test:server", "test:frontend"]

[tasks."lint:server"]
description = "Check Rust formatting and clippy"
run = [
  "cargo fmt --manifest-path server/Cargo.toml --check",
  "cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings",
]

[tasks."lint:frontend"]
description = "Typecheck, eslint and prettier check the frontend"
depends = ["install"]
dir = "frontend"
run = "npm run lint"

[tasks.lint]
description = "Lint everything"
depends = ["lint:server", "lint:frontend"]

[tasks.fmt]
description = "Format all code"
depends = ["install"]
run = [
  "cargo fmt --manifest-path server/Cargo.toml",
  "npm --prefix frontend run format",
]

[tasks."docker:build"]
description = "Build the Docker image"
run = "docker build -t tributary ."
# Everything the Dockerfile copies, so unchanged builds are skipped. Use
# `mise run docker:build --force` to build anyway.
sources = [
  "Dockerfile",
  ".dockerignore",
  "server/Cargo.toml",
  "server/Cargo.lock",
  "server/src/**/*",
  "server/migrations/**/*",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/index.html",
  "frontend/tsconfig.json",
  "frontend/vite.config.ts",
  "frontend/src/**/*",
]

[tasks."docker:run"]
description = "Run the Docker image with ./tributary.toml and a ./data volume"
depends = ["docker:build"]
run = "docker run --rm -p 8080:8080 -v \"$PWD/tributary.toml:/config/tributary.toml:ro\" -v \"$PWD/data:/data\" tributary"
